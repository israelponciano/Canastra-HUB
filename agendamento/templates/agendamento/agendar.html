{% extends 'master.html' %}
{% load static %}

{% block conteudo %}
<div class="container" style="margin-top: 4rem; margin-bottom: 4rem;">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            
            <div class="card border-0 shadow-sm" style="border-radius: 16px; background-color: #ffffff; padding: 2.5rem;">
                <div class="card-body p-0">
                    
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: #22c55e; margin-bottom: 0.5rem;">Reservar Espaço</h2>
                        <p class="text-muted small">Selecione a sala e defina o horário pretendido.</p>
                    </div>

                    <form method="POST" action="{% url 'realizar_reserva' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="sala" class="form-label fw-semibold" style="color: #333;">Qual é a Sala?</label>
                            <select class="form-select form-control-lg" id="sala" name="sala" style="border-radius: 8px;" required>
                                <option value="" disabled selected>Escolha uma opção...</option>
                                <option value="A">Sala A (Coworking)</option>
                                <option value="B">Sala B (Atendimento)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="inicio" class="form-label fw-semibold" style="color: #333;">Data e Hora de Início</label>
                            <input type="datetime-local" class="form-control form-control-lg" id="inicio" name="inicio" style="border-radius: 8px;" required>
                        </div>

                        <div class="mb-4">
                            <label for="fim" class="form-label fw-semibold" style="color: #333;">Data e Hora de Término</label>
                            <input type="datetime-local" class="form-control form-control-lg" id="fim" name="fim" style="border-radius: 8px;" required>
                        </div>

                        <div class="text-center d-grid">
                            <button type="submit" class="btn btn-lg fw-bold text-white shadow-sm" style="background-color: #22c55e; border: none; border-radius: 8px; padding: 12px;">
                                Confirmar e Agendar
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const inputInicio = document.getElementById("inicio");
        const inputFim = document.getElementById("fim");

        const agora = new Date();
        const ano = agora.getFullYear();
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const dia = String(agora.getDate()).padStart(2, '0');
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');
        
        const dataMinima = `${ano}-${mes}-${dia}T${horas}:${minutos}`;
        inputInicio.min = dataMinima;
        inputFim.min = dataMinima;

        inputInicio.addEventListener("change", function() {
            inputFim.min = inputInicio.value;
        });
    });
</script>
{% endblock %}
