<!-- ═══════════ ENDEREÇO ═══════════ -->

<div class="card shadow-sm mb-4" style="border-radius:14px; border:none;">
  <div class="card-body">
    <h5 class="fw-bold mb-3">Endereço</h5>


<div class="row g-3">
  <div class="col-md-6">
    <label class="form-label">Estado</label>
    <select name="estado" class="form-select" id="estado" required>
      <option value="">Selecione</option>
      {% for estado in estados %}
        <option value="{{ estado.id }}"
          {% if empresa.estado and empresa.estado.id == estado.id %}selected{% endif %}>
          {{ estado.nome_estado }}
        </option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label">Cidade</label>
    <select name="cidade" class="form-select" id="cidade" required>
      <option value="">Selecione</option>
      {% for cidade in cidades %}
        <option value="{{ cidade.id }}"
          {% if empresa.cidade and empresa.cidade.id == cidade.id %}selected{% endif %}>
          {{ cidade.nome_cidade }}
        </option>
      {% endfor %}
    </select>
  </div>
</div>


  </div>
</div>

<!-- ═══════════ HUBS ═══════════ -->

<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h5 class="fw-bold mb-3">Hubs de Interesse</h5>


<div class="row">
  {% for hub in hubs %}
  <div class="col-md-4">
    <div class="form-check">
      <input class="form-check-input" type="checkbox"
             name="hubs"
             value="{{ hub.id }}"
             {% if hub.id in hubs_vinculados %}checked{% endif %}>
      <label class="form-check-label">{{ hub.nome_hub }}</label>
    </div>
  </div>
  {% endfor %}
</div>


  </div>
</div>
