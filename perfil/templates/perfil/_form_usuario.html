<!-- ═══════════ OBJETIVO PROFISSIONAL ═══════════ -->

<div class="card shadow-sm mb-4" style="border-radius:14px; border:none;">
  <div class="card-body">
    <h5 class="fw-bold mb-3 text-success">Objetivo Profissional</h5>

```
<div class="row g-3">
  <div class="col-md-6">
    <label>Cargo Pretendido</label>
    <input type="text" name="cargo_pretendido" class="form-control" value="{{ usuario.cargo_pretendido }}">
  </div>

  <div class="col-md-6">
    <label>Área de Interesse</label>
    <input type="text" name="area_interesse" class="form-control" value="{{ usuario.area_interesse }}">
  </div>

  <div class="col-md-6">
    <label>Pretensão Salarial</label>
    <input type="text" name="pretensao_salarial" class="form-control" value="{{ usuario.pretensao_salarial }}">
  </div>

  <div class="col-md-6">
    <label>Disponibilidade</label>
    <select name="disponibilidade" class="form-select">
      <option value="">Selecione</option>
      <option value="manha" {% if usuario.disponibilidade == 'manha' %}selected{% endif %}>Manhã</option>
      <option value="tarde" {% if usuario.disponibilidade == 'tarde' %}selected{% endif %}>Tarde</option>
      <option value="noite" {% if usuario.disponibilidade == 'noite' %}selected{% endif %}>Noite</option>
      <option value="integral" {% if usuario.disponibilidade == 'integral' %}selected{% endif %}>Integral</option>
    </select>
  </div>
</div>
```

  </div>
</div>

<div class="card shadow-sm mb-4">
  <div class="card-body">

```
<div class="section-header">
  <h5 class="fw-bold">Formação Acadêmica</h5>
  <button type="button" class="add-btn" onclick="addItem('formacao')">➕</button>
</div>

{% for i in "123" %}
<div class="dynamic-group {% if forloop.first %}active{% endif %}" data-section="formacao">
  <div class="row g-3">

    <div class="col-md-6">
      <label>Instituição</label>
      <input type="text" name="instituicao_nome{{ i }}" class="form-control">

    </div>

      <input type="text" name="situacao_academica{{ i }}" class="form-control">

      <input type="date" name="data_acad_fim{{ i }}" class="form-control">
    </div>

  </div>
</div>
{% endfor %}
```

<!-- SCRIPT -->

<script>
function addItem(section) {
  const groups = document.querySelectorAll(`[data-section="${section}"]`);
  const active = document.querySelectorAll(`[data-section="${section}"].active`);

  if (active.length < groups.length) {
    groups[active.length].classList.add('active');
  }
}
</script>
